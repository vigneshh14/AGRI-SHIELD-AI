name: advisory-safety-tests
on: [push, pull_request, workflow_dispatch]
jobs:
  jvm-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler 2.1.0
        run: |
          curl -sSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlinc.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"
      - name: KnowledgeBase.kt is in sync with the JSON
        run: |
          cp advisory/KnowledgeBase.kt /tmp/before.kt
          python3 advisory/gen_kb_kotlin.py
          cmp advisory/KnowledgeBase.kt /tmp/before.kt
      - name: Compile (warnings are errors)
        run: kotlinc -Werror advisory/*.kt advisory/tests/*.kt advisory/tests/stubs/*.kt -d out
      - name: Run gate, guard and engine tests
        run: |
          kotlin -cp out com.agrishield.advisory.AdvisoryGateTestKt | tee test.log
          grep -q "ALL 73 CHECKS PASSED" test.log
