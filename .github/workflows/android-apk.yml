name: android-apk
on:
  push:
    paths: ["PHASE4/android_app/**", "android/advisory/**", "knowledge_base/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: PHASE4/android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: APK identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agri-shield-ai-debug-apk
          path: |
            PHASE4/android_app/app/build/outputs/apk/debug/app-debug.apk
            PHASE4/android_app/app-debug.apk.sha256
          if-no-files-found: error
