name: android-apk
on:
  push:
    paths: ["android_app/**", "advisory/**", "knowledge_base/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write   # to publish the APK on the rolling "apk-latest" pre-release
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: APK identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agri-shield-ai-debug-apk
          path: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
            android_app/app-debug.apk.sha256
          if-no-files-found: error
      - name: Publish APK to the apk-latest pre-release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk agri-shield-ai-debug.apk
          sha256sum agri-shield-ai-debug.apk > agri-shield-ai-debug.apk.sha256
          NOTES="Debug APK built by CI from ${GITHUB_SHA::7}. Models are NOT inside: run scripts/run_on_phone.ps1. SHA256: $(cut -d' ' -f1 agri-shield-ai-debug.apk.sha256)"
          # Recreate release and tag on this commit every time, so the tag never
          # points at a commit that is no longer on main (e.g. after a history rewrite).
          gh release delete apk-latest --cleanup-tag --yes 2>/dev/null || true
          git push --delete origin refs/tags/apk-latest 2>/dev/null || true
          gh release create apk-latest agri-shield-ai-debug.apk agri-shield-ai-debug.apk.sha256 \
            --prerelease --title "AGRI-SHIELD AI debug APK (latest CI build)" --notes "$NOTES" --target "$GITHUB_SHA"
